<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract smoky ember background">
  <defs>
    <radialGradient id="emberCore" cx="50%" cy="66%" r="48%">
      <stop offset="0" stop-color="#db6a2a" stop-opacity="0.85"/>
      <stop offset="0.38" stop-color="#b6461f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#120b08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="72%" cy="28%" r="34%">
      <stop offset="0" stop-color="#d7a14a" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#7d321f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#120b08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smokeWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c120e"/>
      <stop offset="0.5" stop-color="#241815"/>
      <stop offset="1" stop-color="#070403"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#smokeWash)"/>
  <rect width="1600" height="1000" fill="url(#emberCore)"/>
  <rect width="1600" height="1000" fill="url(#goldGlow)"/>
  <g filter="url(#softBlur)" opacity="0.75">
    <path d="M-90 755 C170 615 230 345 520 405 C720 448 730 640 957 628 C1183 617 1245 332 1690 303 L1690 1085 L-90 1085 Z" fill="#5f2319" opacity="0.64"/>
    <path d="M-55 190 C245 35 480 250 705 175 C913 106 1014 -40 1320 94 C1440 147 1537 190 1685 162 L1685 -80 L-55 -80 Z" fill="#8f7b6d" opacity="0.22"/>
    <path d="M216 872 C327 708 483 690 580 808 C684 934 868 916 984 778 C1110 627 1365 653 1490 838 C1320 950 1135 1006 928 1015 C617 1029 383 980 216 872 Z" fill="#db6a2a" opacity="0.26"/>
  </g>
  <g opacity="0.38">
    <circle cx="255" cy="715" r="3" fill="#d7a14a"/>
    <circle cx="412" cy="803" r="2" fill="#f4dfc8"/>
    <circle cx="893" cy="720" r="3" fill="#db6a2a"/>
    <circle cx="1196" cy="815" r="2" fill="#d7a14a"/>
    <circle cx="1328" cy="652" r="2" fill="#f4dfc8"/>
    <circle cx="712" cy="878" r="2" fill="#d7a14a"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.55"/>
  <rect width="1600" height="1000" fill="#120b08" opacity="0.22"/>
</svg>
