    <circle cx="980" cy="575" r="2" fill="#fff5ea"/>
    <circle cx="1170" cy="690" r="3" fill="#f06e1d"/>
    <circle cx="1315" cy="500" r="2" fill="#ffb347"/>
    <circle cx="1440" cy="720" r="3" fill="#fff5ea"/>
  </g>
  <g opacity="0.28" stroke="#f06e1d" stroke-width="2">
    <path d="M160 830 C420 760 612 812 790 744 C1018 657 1190 710 1450 636" fill="none"/>
    <path d="M120 876 C395 824 600 880 852 792 C1060 720 1260 792 1502 708" fill="none"/>
