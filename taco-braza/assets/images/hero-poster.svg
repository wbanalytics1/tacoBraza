<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Fire sparks over a black background for Taco Braza hero media">
  <defs>
    <radialGradient id="emberCore" cx="50%" cy="72%" r="42%">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.98"/>
      <stop offset="0.18" stop-color="#f06e1d" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#8f2b0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flareRight" cx="78%" cy="48%" r="34%">
      <stop offset="0" stop-color="#f06e1d" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#7a2108" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flareLeft" cx="24%" cy="56%" r="30%">
      <stop offset="0" stop-color="#f06e1d" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#5b1605" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="sparkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#020202"/>
  <rect width="1600" height="1000" fill="url(#emberCore)"/>
  <rect width="1600" height="1000" fill="url(#flareRight)"/>
  <rect width="1600" height="1000" fill="url(#flareLeft)"/>

  <g filter="url(#softBlur)" opacity="0.9">
    <path d="M-140 810 C70 690 270 742 460 602 C650 462 760 592 930 500 C1110 405 1292 294 1730 388 L1730 1100 L-140 1100 Z" fill="#260b04"/>
    <path d="M110 960 C250 760 430 770 574 842 C725 917 850 880 972 722 C1120 530 1370 630 1535 868 C1285 1022 956 1052 670 1028 C430 1008 238 986 110 960 Z" fill="#f06e1d" opacity="0.34"/>
    <path d="M580 1040 C635 780 710 720 800 626 C906 514 998 610 1012 754 C1028 910 900 1000 830 1060 Z" fill="#ff9a32" opacity="0.36"/>
    <path d="M350 1018 C418 862 500 796 568 696 C642 588 696 720 650 838 C610 940 514 996 430 1052 Z" fill="#f06e1d" opacity="0.3"/>
  </g>

  <g filter="url(#sparkGlow)">
    <g fill="#ffb45c">
      <circle cx="167" cy="654" r="2.3"/><circle cx="244" cy="782" r="1.7"/><circle cx="342" cy="580" r="2.1"/><circle cx="471" cy="704" r="2.6"/><circle cx="596" cy="524" r="1.9"/><circle cx="720" cy="662" r="2.2"/><circle cx="846" cy="760" r="2.8"/><circle cx="1010" cy="566" r="2"/><circle cx="1176" cy="690" r="2.5"/><circle cx="1318" cy="512" r="1.8"/><circle cx="1452" cy="740" r="2.6"/>
    </g>
    <g fill="#f06e1d" opacity="0.9">
      <circle cx="225" cy="462" r="1.6"/><circle cx="388" cy="430" r="1.9"/><circle cx="552" cy="358" r="1.4"/><circle cx="694" cy="422" r="1.8"/><circle cx="890" cy="360" r="1.5"/><circle cx="1090" cy="430" r="1.8"/><circle cx="1250" cy="350" r="1.4"/><circle cx="1398" cy="448" r="1.7"/>
    </g>
    <g stroke="#ffb45c" stroke-width="2" stroke-linecap="round" opacity="0.72">
      <path d="M314 828 l34 -54"/><path d="M520 792 l48 -76"/><path d="M766 850 l38 -68"/><path d="M1028 774 l54 -90"/><path d="M1290 806 l42 -72"/>
    </g>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.78"/>
  <rect width="1600" height="1000" fill="#000" opacity="0.2"/>
</svg>
