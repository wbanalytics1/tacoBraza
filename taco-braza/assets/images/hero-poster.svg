    <path d="M-40 164 C216 50 402 238 640 164 C880 90 1038 -42 1306 108 C1438 182 1510 205 1660 160 L1660 -80 L-40 -80 Z" fill="#5d514b" opacity="0.22"/>
  </g>
  <g opacity="0.82">
    <circle cx="230" cy="630" r="3" fill="#ffb347"/>
    <circle cx="310" cy="760" r="2" fill="#f06e1d"/>
    <circle cx="430" cy="540" r="2" fill="#fff5ea"/>
