<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract fire sparks over a dark grill background">
  <defs>
    <radialGradient id="fireCore" cx="52%" cy="78%" r="48%">
      <stop offset="0" stop-color="#f6b15f" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#f06e1d" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#7c2208" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sideGlow" cx="78%" cy="32%" r="38%">
      <stop offset="0" stop-color="#f06e1d" stop-opacity="0.46"/>
      <stop offset="0.55" stop-color="#351006" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blackSmoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.5" stop-color="#16110e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#blackSmoke)"/>
  <rect width="1600" height="1000" fill="url(#fireCore)"/>
  <rect width="1600" height="1000" fill="url(#sideGlow)"/>
  <g filter="url(#blur)" opacity="0.84">
    <path d="M-100 735 C130 596 338 650 510 510 C710 345 888 568 1082 438 C1262 318 1448 245 1710 326 L1710 1078 L-100 1078 Z" fill="#441207" opacity="0.9"/>
